name: State transition
on:
  issue_comment:
    types: [created]

jobs:
  transition:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Handle /accept or /reject
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const issue_number = context.payload.issue.number;
            const { owner, repo } = context.repo;

            if (body === '/accept') {
              const comments = await github.paginate(
                github.rest.issues.listComments, { owner, repo, issue_number }
              );
              const findings = comments.filter(c => c.body.includes('### FINDING'));
              if (findings.length === 0) {
                await github.rest.reactions.createForIssueComment({
                  owner, repo, comment_id: context.payload.comment.id, content: '-1'
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: 'Cannot accept: no `### FINDING` comment exists on this Issue yet.'
                });
                return;
              }
              const hasStampedFinding = findings.some(c => /Source commit:\s*\S+/.test(c.body));
              if (!hasStampedFinding) {
                await github.rest.reactions.createForIssueComment({
                  owner, repo, comment_id: context.payload.comment.id, content: '-1'
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: 'Cannot accept: the `### FINDING` comment is missing a `Source commit:` line.'
                });
                return;
              }
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: 'state:claimed'
              }).catch(() => {});
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['state:accepted']
              });
            } else if (body === '/reject') {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number, name: 'state:claimed'
              }).catch(() => {});
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['state:rejected']
              });
            }
